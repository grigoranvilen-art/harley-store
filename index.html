<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Harley Store</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#151515);--hint:var(--tg-theme-hint-color,#737373);--button:var(--tg-theme-button-color,#e26a19);--button-text:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f3f3f3);--line:#d9d9d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:24px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;padding:8px 14px;border-radius:18px;background:var(--card);font-size:13px;white-space:nowrap}.tab.active{background:var(--button);color:var(--button-text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 12px}.card{background:var(--card);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;position:relative}.card>img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e5e5e5}.badge{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:4px 7px;border-radius:7px}.card-body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}.card-title{font-size:12.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.65em}.price{font-size:14px;font-weight:700}.price-note{font-size:11px;color:var(--hint)}button{font:inherit}.card-btn,.order-btn{border:0;border-radius:9px;background:var(--button);color:var(--button-text);padding:8px;font-weight:650}.card-btn{margin-top:auto;font-size:12.5px}.empty{text-align:center;color:var(--hint);padding:42px 20px}.modal{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:none}.modal.open{display:block}.modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}.back{border:0;background:var(--card);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:22px}.gallery-main{width:100%;aspect-ratio:1/1;object-fit:contain;background:#eee;display:block}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}.thumb{width:62px;height:62px;flex:0 0 auto;object-fit:cover;border-radius:8px;border:2px solid transparent;background:#eee}.thumb.active{border-color:var(--button)}.details{padding:4px 14px 28px}.details h1{font-size:21px;line-height:1.2;margin:8px 0}.detail-price{font-size:19px;font-weight:750;margin:10px 0 3px}.moto-final{color:var(--hint);font-size:13px;margin-bottom:14px}.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}.facts dt{color:var(--hint)}.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}.section{margin-top:17px}.section h2{font-size:15px;margin:0 0 7px}.section p{font-size:14px;line-height:1.45;margin:0;white-space:pre-line}.order-btn{width:100%;margin-top:20px;padding:12px;font-size:15px}
</style></head><body><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="empty" id="empty">Загрузка каталога…</div><section class="modal" id="modal" aria-hidden="true"><div class="modal-head"><button class="back" id="back">‹</button><strong>Карточка товара</strong></div><div id="product"></div></section>
<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}const BOT_USERNAME="HarleyStoreBot";let CATALOG=[],activeCategory=null;const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));const money=v=>v===null||v===undefined||v===""?"":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const outOfStock=v=>/out\s*of\s*stock|unavailable|sold/i.test(v||"");
function renderTabs(){const counts={};CATALOG.forEach(x=>counts[x.category]=(counts[x.category]||0)+1);const names=Object.keys(counts).sort();if(!activeCategory&&names.length)activeCategory=names[0];tabs.innerHTML=names.map(n=>`<div class="tab ${n===activeCategory?"active":""}" data-cat="${esc(n)}">${esc(n)} (${counts[n]})</div>`).join("");tabs.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{activeCategory=el.dataset.cat;renderTabs();renderGrid()})}function priceHtml(i){return i.is_moto?`<div class="price">Цена в США: ${money(i.usa_price)}</div><div class="price-note">Итоговая цена — по запросу</div>`:`<div class="price">${money(i.price)}</div>`}function renderGrid(){const items=CATALOG.filter(x=>x.category===activeCategory);grid.innerHTML=items.map(item=>`<article class="card" data-index="${CATALOG.indexOf(item)}">${outOfStock(item.availability)?'<div class="badge">Нет в наличии</div>':""}<img src="${esc(item.photo)}" loading="lazy" alt="${esc(item.title)}"><div class="card-body"><div class="card-title">${esc(item.title)}</div>${priceHtml(item)}<button class="card-btn">Подробнее</button></div></article>`).join("");grid.querySelectorAll(".card").forEach(el=>el.onclick=()=>openProduct(CATALOG[Number(el.dataset.index)]))}
const fact=(l,v)=>v!==undefined&&v!==null&&String(v).trim()?`<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`:"";const section=(t,v)=>v!==undefined&&v!==null&&String(v).trim()?`<section class="section"><h2>${esc(t)}</h2><p>${esc(v)}</p></section>`:"";function openProduct(i){const photos=i.photos?.length?i.photos:[i.photo];const facts=[fact("Размеры",i.sizes),fact("Цвет",i.colors),fact("Наличие",i.availability),fact("SKU",i.sku),fact("Бренд",i.brand),fact("Страна происхождения",i.country_of_origin),i.is_moto?fact("Год",i.year):"",i.is_moto?fact("Пробег",i.mileage?`${i.mileage} mi`:""):""].join("");product.innerHTML=`<img class="gallery-main" id="mainPhoto" src="${esc(photos[0])}" alt="${esc(i.title)}">${photos.length>1?`<div class="thumbs">${photos.map((p,n)=>`<img class="thumb ${n===0?"active":""}" src="${esc(p)}" data-src="${esc(p)}">`).join("")}</div>`:""}<div class="details"><h1>${esc(i.title)}</h1><div class="detail-price">${i.is_moto?`Цена в США: ${money(i.usa_price)}`:money(i.price)}</div>${i.is_moto?'<div class="moto-final">Итоговая цена с доставкой и оформлением — по запросу</div>':""}${facts?`<dl class="facts">${facts}</dl>`:""}${section("Описание",i.description)}${section("Материалы / состав",i.materials)}${section("Характеристики",i.features)}<button class="order-btn" id="order">${i.is_moto?"Запросить итоговую цену":"Заказать"}</button></div>`;product.querySelectorAll(".thumb").forEach(t=>t.onclick=()=>{mainPhoto.src=t.dataset.src;product.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));t.classList.add("active")});order.onclick=()=>orderProduct(i);modal.classList.add("open");document.body.style.overflow="hidden"}function closeProduct(){modal.classList.remove("open");document.body.style.overflow=""}back.onclick=closeProduct;function orderProduct(i){const url=`https://t.me/${BOT_USERNAME}?start=order_${i.row}`;tg?.openTelegramLink?tg.openTelegramLink(url):window.open(url,"_blank")}
fetch("catalog.json?v=full-refresh-20260903",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{CATALOG=data;empty.style.display=CATALOG.length?"none":"block";empty.textContent=CATALOG.length?"":"Каталог пуст.";renderTabs();renderGrid()}).catch(err=>{empty.style.display="block";empty.textContent="Не удалось загрузить каталог: "+err.message});
</script></body></html>
